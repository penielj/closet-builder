<!doctype html>
<!-- Spike 0.2 (results in spikes/RESULTS.md): does the two-tap share flow work
     from the installed iPhone app with a ~20MB backup-sized file? Throwaway page. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="../icons/icon-192.png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <title>Share spike</title>
  <style>
    body { font: 16px/1.4 -apple-system, system-ui, sans-serif; margin: 0; padding: 16px; max-width: 560px; }
    button { font: inherit; width: 100%; padding: 14px; margin: 6px 0; border-radius: 10px; border: 1px solid #999; background: #f4f4f4; }
    button:disabled { opacity: .4; }
    #status { padding: 10px; border-radius: 8px; background: #eef; margin: 10px 0; }
    #log { font: 13px/1.4 ui-monospace, monospace; white-space: pre-wrap; background: #111; color: #ddd; padding: 10px; border-radius: 8px; min-height: 120px; }
    label { display: block; margin: 8px 0; }
    .pass { color: #0a7a2f; font-weight: 600; } .fail { color: #b00020; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Share spike</h1>
  <div id="env"></div>
  <label>Items: <input id="count" type="number" value="150" min="1" max="600" style="width:6em"> (~133KB base64 each, so 150 ≈ 20MB)</label>
  <button id="prepare">1. Prepare file</button>
  <div id="status">Not prepared.</div>
  <button id="save" disabled>2. Save backup (share sheet)</button>
  <button id="oneTap">Control: prepare + share on ONE tap (expected to fail on iOS)</button>
  <h2>From IndexedDB</h2>
  <button id="store">Store photos first</button>
  <button id="prepareStored" disabled>1b. Prepare file from stored photos</button>
  <h2>Import</h2>
  <label>3. Pick a backup: <input id="importFile" type="file" accept="application/json,.json"></label>
  <button id="readBack" disabled>4. Read back (decode all photos + a second export)</button>
  <h2>Key generator</h2>
  <button id="keys">Write IDs 1–30, clear(), add one more</button>
  <button id="copy">Copy log</button>
  <div id="log"></div>

<script>
const $ = (id) => document.getElementById(id);
const log = (msg) => { $('log').textContent += `[${new Date().toLocaleTimeString()}] ${msg}\n`; };

const standalone = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
$('env').innerHTML =
  `Installed app: <span class="${standalone ? 'pass' : 'fail'}">${standalone ? 'yes' : 'NO, add to home screen first'}</span><br>` +
  `navigator.share: ${'share' in navigator} · canShare: ${'canShare' in navigator}<br>` +
  `<small>${navigator.userAgent}</small>`;
log(`standalone=${standalone} share=${'share' in navigator} canShare=${'canShare' in navigator}`);

// Same encoding as the plan's blobToDataUrl (step 4), so timing reflects the real export.
async function blobToDataUrl(b) {
  const bytes = new Uint8Array(await b.arrayBuffer());
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return `data:${b.type};base64,${btoa(bin)}`;
}
function fakePhoto(n = 100_000) {
  const bytes = new Uint8Array(n);
  for (let i = 0; i < n; i += 65536) crypto.getRandomValues(bytes.subarray(i, Math.min(i + 65536, n)));
  bytes.set([0xff, 0xd8, 0xff], 0);
  return new Blob([bytes], { type: 'image/jpeg' });
}

// Mirrors buildExport (step 6): BlobParts, one photo encoded at a time.
const fakePhotos = (count) => Array.from({ length: count }, () => fakePhoto());
async function buildFile(photos, onProgress) {
  const count = photos.length; // `photos` is the "snapshot"
  const parts = ['{"app":"closet-builder","version":1,"counts":{"items":' + count + ',"outfits":0},"items":['];
  for (let i = 0; i < count; i++) {
    const rec = { id: i + 1, name: `Item ${i + 1}`, photo: await blobToDataUrl(photos[i]) };
    parts.push(i ? ',' : '', JSON.stringify(rec));
    onProgress(i + 1, count);
  }
  parts.push('],"outfits":[]}');
  const date = new Date().toISOString().slice(0, 10);
  return new File(parts, `closet-${date}.closet.json`, { type: 'application/json' });
}

async function share(file) {
  if (!navigator.canShare?.({ files: [file] })) return 'unavailable (canShare false)';
  try { await navigator.share({ files: [file], title: 'Closet backup' }); return 'shared'; }
  catch (e) { return `error: ${e?.name} — ${e?.message}`; }
}

let prepared = null;
$('prepare').onclick = async () => {
  $('prepare').disabled = $('save').disabled = true;
  prepared = null;
  const count = +$('count').value;
  const t0 = performance.now();
  try {
    const file = await buildFile(fakePhotos(count), (d, n) => { $('status').textContent = `Preparing… ${d}/${n}`; });
    const secs = (performance.now() - t0) / 1000;
    prepared = file;
    const mb = (file.size / 1048576).toFixed(1);
    const ok = secs < 15;
    $('status').innerHTML = `Ready: ${file.name}, ${mb}MB in <span class="${ok ? 'pass' : 'fail'}">${secs.toFixed(1)}s</span> (pass < 15s)`;
    log(`prepared ${count} items, ${file.size} bytes (${mb}MB), ${secs.toFixed(2)}s`);
    $('save').disabled = false;
  } catch (e) {
    $('status').innerHTML = `<span class="fail">Prepare failed: ${e?.name} ${e?.message}</span>`;
    log(`prepare FAILED: ${e?.name} ${e?.message}`);
  }
  $('prepare').disabled = false;
};

// Second tap: share immediately, nothing awaited before navigator.share.
$('save').onclick = async () => {
  const result = await share(prepared);
  log(`two-tap share → ${result}`);
};

$('oneTap').onclick = async () => {
  $('oneTap').disabled = true;
  const file = await buildFile(fakePhotos(+$('count').value), (d, n) => { $('status').textContent = `One-tap control: preparing… ${d}/${n}`; });
  $('status').textContent = 'One-tap control: calling share after the wait…';
  log(`one-tap share → ${await share(file)}`);
  $('oneTap').disabled = false;
};

// Plain IndexedDB, as Dexie uses underneath. Photos are stored as Blobs, like the app does.
function openDb(name, upgrade) {
  return new Promise((resolve, reject) => {
    const r = indexedDB.open(name, 1);
    r.onupgradeneeded = () => upgrade(r.result);
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
}
const request = (r) => new Promise((resolve, reject) => { r.onsuccess = () => resolve(r.result); r.onerror = () => reject(r.error); });
const finished = (tx) => new Promise((resolve, reject) => { tx.oncomplete = resolve; tx.onerror = tx.onabort = () => reject(tx.error); });
const photoDb = () => openDb('spike-photos', (db) => db.createObjectStore('photos', { keyPath: 'id' }));

$('store').onclick = async () => {
  $('store').disabled = $('prepareStored').disabled = true;
  const count = +$('count').value;
  try {
    const db = await photoDb();
    const tx = db.transaction('photos', 'readwrite');
    const store = tx.objectStore('photos');
    store.clear();
    fakePhotos(count).forEach((photo, i) => store.put({ id: i + 1, photo }));
    await finished(tx);
    db.close();
    $('status').textContent = `Stored ${count} photos in IndexedDB.`;
    log(`stored ${count} photo Blobs in IndexedDB`);
    $('prepareStored').disabled = false;
  } catch (e) {
    $('status').innerHTML = `<span class="fail">Store failed: ${e?.name} ${e?.message}</span>`;
    log(`store FAILED: ${e?.name} ${e?.message}`);
  }
  $('store').disabled = false;
};

// The real export reads every item in one transaction, then encodes outside it.
$('prepareStored').onclick = async () => {
  $('prepareStored').disabled = $('save').disabled = true;
  prepared = null;
  const t0 = performance.now();
  try {
    const db = await photoDb();
    const rows = await request(db.transaction('photos').objectStore('photos').getAll());
    db.close();
    const file = await buildFile(rows.map((r) => r.photo), (d, n) => { $('status').textContent = `Preparing from IndexedDB… ${d}/${n}`; });
    const secs = (performance.now() - t0) / 1000;
    prepared = file;
    const mb = (file.size / 1048576).toFixed(1);
    const ok = secs < 15;
    $('status').innerHTML = `Ready from IndexedDB: ${file.name}, ${mb}MB in <span class="${ok ? 'pass' : 'fail'}">${secs.toFixed(1)}s</span> (pass < 15s)`;
    log(`prepared ${rows.length} items from IndexedDB, ${file.size} bytes (${mb}MB), ${secs.toFixed(2)}s`);
    $('save').disabled = false;
  } catch (e) {
    $('status').innerHTML = `<span class="fail">Prepare from IndexedDB failed: ${e?.name} ${e?.message}</span>`;
    log(`prepare from IndexedDB FAILED: ${e?.name} ${e?.message}`);
  }
  $('prepareStored').disabled = false;
};

// Import step 1: read, parse and sniff the file, as the importer does before validating.
let imported = null;
$('importFile').onchange = async () => {
  const file = $('importFile').files[0];
  if (!file) return;
  imported = null;
  $('readBack').disabled = true;
  log(`picked ${file.name}, ${file.size} bytes, type "${file.type}"`);
  const t0 = performance.now();
  try {
    const data = JSON.parse(await file.text());
    const ok = data?.app === 'closet-builder' && data?.version === 1 && Array.isArray(data?.items);
    const photos = ok ? data.items.filter((i) => typeof i.photo === 'string' && i.photo.startsWith('data:image/')).length : 0;
    const secs = (performance.now() - t0) / 1000;
    $('status').innerHTML = `Parsed: ${ok ? `${data.items.length} items, ${photos} photos` : '<span class="fail">not a closet backup</span>'} in `
      + `<span class="${secs < 10 ? 'pass' : 'fail'}">${secs.toFixed(1)}s</span> (pass < 10s)`;
    log(`import parse + sniff: ${ok ? `ok, ${data.items.length} items, ${photos} photos` : 'NOT a closet backup'}, ${secs.toFixed(2)}s`);
    if (ok) { imported = data; $('readBack').disabled = false; }
  } catch (e) {
    $('status').innerHTML = `<span class="fail">Import parse failed: ${e?.name} ${e?.message}</span>`;
    log(`import parse FAILED: ${e?.name} ${e?.message}`);
  }
};

function dataUrlToBlob(url) {
  const comma = url.indexOf(',');
  const bin = atob(url.slice(comma + 1));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], { type: url.slice(5, url.indexOf(';')) });
}

// Import step 2: decode every photo, then build a second export while still holding the
// parsed file, to see whether both in memory at once crashes the app.
$('readBack').onclick = async () => {
  $('readBack').disabled = true;
  const t0 = performance.now();
  try {
    const blobs = imported.items.map((i) => dataUrlToBlob(i.photo));
    const decoded = blobs.reduce((n, b) => n + b.size, 0);
    log(`decoded ${blobs.length} photos, ${decoded} bytes, ${((performance.now() - t0) / 1000).toFixed(2)}s`);
    const file = await buildFile(blobs, (d, n) => { $('status').textContent = `Second export… ${d}/${n}`; });
    const secs = (performance.now() - t0) / 1000;
    $('status').innerHTML = `<span class="pass">Read back</span>: ${blobs.length} photos decoded, second export ${(file.size / 1048576).toFixed(1)}MB, ${secs.toFixed(1)}s`;
    log(`read back done: second export ${file.size} bytes, ${secs.toFixed(2)}s total, holding ${imported.items.length} parsed items`);
  } catch (e) {
    $('status').innerHTML = `<span class="fail">Read back failed: ${e?.name} ${e?.message}</span>`;
    log(`read back FAILED: ${e?.name} ${e?.message}`);
  }
  $('readBack').disabled = false;
};

// clear() must not reset the key generator, or a restored closet could reuse old IDs.
$('keys').onclick = async () => {
  $('keys').disabled = true;
  try {
    await request(indexedDB.deleteDatabase('spike-keys'));
    const db = await openDb('spike-keys', (d) => d.createObjectStore('things', { autoIncrement: true }));
    let tx = db.transaction('things', 'readwrite');
    for (let i = 0; i < 30; i++) tx.objectStore('things').add({ n: i });
    await finished(tx);
    tx = db.transaction('things', 'readwrite');
    tx.objectStore('things').clear();
    const next = await request(tx.objectStore('things').add({ n: 'after clear' }));
    await finished(tx);
    db.close();
    const ok = next === 31;
    $('status').innerHTML = `Key after clear(): <span class="${ok ? 'pass' : 'fail'}">${next}</span> (pass = 31)`;
    log(`key generator: wrote 1–30, clear(), next key ${next} (${ok ? 'pass' : 'FAIL'})`);
  } catch (e) {
    $('status').innerHTML = `<span class="fail">Key test failed: ${e?.name} ${e?.message}</span>`;
    log(`key generator FAILED: ${e?.name} ${e?.message}`);
  }
  $('keys').disabled = false;
};

$('copy').onclick = async () => {
  try { await navigator.clipboard.writeText($('log').textContent); log('log copied'); }
  catch { log('copy failed: select the log text by hand'); }
};

// If the page reloads mid-prepare (iOS memory kill), this counter makes it visible.
try {
  const n = +(sessionStorage.getItem('loads') || 0) + 1;
  sessionStorage.setItem('loads', n);
  if (n > 1) log(`NOTE: page has loaded ${n} times this session; a reload during prepare means a crash`);
} catch {}
</script>
</body>
</html>
