<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#11100e" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Closet" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Vite prefixes these with `base` (/closet-builder/) at build time. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Closet Builder</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // If the app hasn't drawn anything 8 seconds in, or one of its files failed to load,
      // say so instead of leaving a blank screen. The closet itself is never touched here:
      // "Refresh app files" only clears the offline copy of the app (DESIGN §7 "Offline").
      (function () {
        var shown = false
        function show(why) {
          var root = document.getElementById('root')
          if (shown || (root && root.childElementCount)) return
          shown = true
          var box = document.createElement('div')
          box.setAttribute('role', 'alert')
          box.style.cssText = 'font:15px/1.5 -apple-system,Helvetica,sans-serif;padding:48px 20px;max-width:520px;margin:0 auto;color:#181715'
          box.innerHTML = '<p style="font-size:20px;margin:0 0 8px">Closet Builder didn’t start.</p>'
            + '<p style="margin:0 0 16px;color:#7d786f">Your closet is safe. Try again, and if that doesn’t help, refresh the app files.</p>'
            + '<pre style="white-space:pre-wrap;font-size:12px;color:#7d786f;margin:0 0 20px"></pre>'
            + '<button id="retry" style="font:inherit;padding:12px 16px;margin-right:8px">Try again</button>'
            + '<button id="refresh" style="font:inherit;padding:12px 16px">Refresh app files</button>'
          box.querySelector('pre').textContent = why
          document.body.appendChild(box)
          box.querySelector('#retry').onclick = function () { location.reload() }
          box.querySelector('#refresh').onclick = function () {
            var jobs = []
            if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister() })) }))
            if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.filter(function (k) { return k.indexOf('closet-') === 0 }).map(function (k) { return caches.delete(k) })) }))
            Promise.all(jobs).then(function () { location.reload() }, function () { location.reload() })
          }
        }
        window.addEventListener('error', function (e) {
          var t = e.target
          if (t && t !== window && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) show('A file didn’t load: ' + (t.src || t.href))
          else if (e.message) show(e.message)
        }, true)
        setTimeout(function () { show('It took more than 8 seconds to open.') }, 8000)
        window.__closetShowStartupError = show
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
